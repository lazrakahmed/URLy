# Static UI server. Runs as non-root (nginx-unprivileged), port 8080.
# Serves files only, on purpose: /api/* and /{code} are routed to the API by the
# ALB in AWS and by the compose gateway locally (see story 3), never by this server.
server {
    listen 8080;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    add_header Content-Security-Policy "default-src 'self'; frame-ancestors 'none'" always;
    add_header X-Content-Type-Options "nosniff" always;

    location / {
        try_files $uri $uri/ =404;
    }
}
