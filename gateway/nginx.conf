# LOCAL ONLY: stands in for the AWS ALB. Routing order (same as the ALB rules):
#   1. the UI files  -> ui service
#   2. /api/*        -> api service
#   3. everything else (/{code}) -> api service
resolver 127.0.0.11 valid=5s;  # Docker's DNS: re-resolve so api replicas are load balanced

server {
    listen 80;

    set $ui  ui:8080;
    set $api api:8000;

    # Same headers the ALB adds, so the API sees the real client address.
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_set_header X-Forwarded-Proto $scheme;

    location = /          { proxy_pass http://$ui; }
    location = /app.js    { proxy_pass http://$ui; }
    location = /style.css { proxy_pass http://$ui; }

    location /api/        { proxy_pass http://$api; }
    location /            { proxy_pass http://$api; }
}
